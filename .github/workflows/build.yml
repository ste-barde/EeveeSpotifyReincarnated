name: Build IPA
on: workflow_dispatch
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          if [ -f Podfile ]; then pod install; fi
          WS=$(ls -d *.xcworkspace 2>/dev/null | head -1)
          if [ -n "$WS" ]; then T="-workspace $WS"; else T="-project $(ls -d *.xcodeproj | head -1)"; fi
          SCHEME=$(xcodebuild -list -json $T | python3 -c "import sys,json; d=json.load(sys.stdin); d=d.get('workspace') or d.get('project'); print(d['schemes'][0])")
          xcodebuild $T -scheme "$SCHEME" -configuration Release -sdk iphoneos -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/*.app Payload/
          zip -r app.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ipa
          path: app.ipa
